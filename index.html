<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Party Locator</title>
<meta name="theme-color" content="#0b3d91">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Party Locator">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
  html, body { margin: 0; height: 100%; background: #f2f4f7; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
            justify-content: center; background: #0b3d91; color: #fff;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; transition: opacity .3s; }
  #splash img { width: 96px; height: 96px; border-radius: 22px; }
  #splash p { margin-top: 14px; font-size: 16px; opacity: .9; }
  #offline { display: none; position: fixed; inset: 0; align-items: center; justify-content: center;
             text-align: center; padding: 24px; background: #f2f4f7; color: #1d2433;
             font-family: system-ui, sans-serif; }
</style>
</head>
<body>
  <div id="splash"><img src="icon-192.png" alt=""><p>Loading Party Locator…</p></div>
  <div id="offline"><div><h2>No internet</h2><p>Connect to mobile data or Wi-Fi and reopen the app.</p></div></div>
  <iframe id="app" title="Party Locator" allow="geolocation"></iframe>

<script>
  // ▼▼▼ PASTE YOUR APPS SCRIPT WEB APP URL HERE (ends with /exec) ▼▼▼
  const APP_URL = 'https://script.google.com/a/macros/jainwireindia.com/s/AKfycbzpn_80hJuwlZ3-twpezcjh6UDxqKLtY-33tANH_h8xHZv8xgEsoRyUN5TmiVYL4UUmyw/exec';
  // ▲▲▲ ------------------------------------------------------------ ▲▲▲

  const frame = document.getElementById('app');
  const splash = document.getElementById('splash');
  const hideSplash = () => { splash.style.opacity = 0; setTimeout(() => splash.remove(), 300); };

  if (!navigator.onLine) {
    document.getElementById('offline').style.display = 'flex';
    splash.remove();
  } else {
    frame.addEventListener('load', hideSplash);
    setTimeout(hideSplash, 8000);
    frame.src = APP_URL;
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js'));
  }
</script>
</body>
</html>
